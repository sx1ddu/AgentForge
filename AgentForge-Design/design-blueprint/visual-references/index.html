<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgentForge — The Forge Design Prototype</title>
<style>
:root{--bg:#0b0d0c;--side:#101310;--surface:#151916;--elev:#1b211c;--input:#111512;--text:#f1f4ed;--sub:#a7b0a4;--muted:#778174;--line:#293129;--line2:#3a4739;--lime:#c7f36b;--limeink:#17210d;--blue:#8eb8d8;--purple:#c49be8;--amber:#e6b86a;--green:#78c99a;--red:#ef8178;--sans:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;--mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans)}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}a{color:inherit;text-decoration:none}.app{min-height:100vh;display:grid;grid-template-columns:56px 242px minmax(0,1fr)}.rail{background:#0e110f;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:14px}.brand{width:32px;height:32px;background:var(--lime);color:var(--limeink);display:grid;place-items:center;border-radius:8px;font-weight:900;font-size:13px;letter-spacing:-1px}.railbtn{width:36px;height:36px;border:0;background:transparent;color:var(--muted);border-radius:8px;font-size:16px}.railbtn.active,.railbtn:hover{background:#202820;color:var(--lime)}.railbottom{margin-top:auto}.side{background:var(--side);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;min-height:100vh}.sidehead{display:flex;justify-content:space-between;align-items:center;padding:0 6px 18px}.wordmark{font-weight:700;letter-spacing:-.04em;font-size:15px}.wordmark small{display:block;color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;margin-top:1px}.new{width:100%;text-align:left;border:1px solid var(--line2);background:#171d17;border-radius:8px;padding:10px 11px;font-size:12px;font-weight:600}.new b{float:right;color:var(--muted);font:10px var(--mono)}.search{margin:12px 0 18px;background:#0c100d;border:1px solid var(--line);border-radius:7px;padding:8px 10px;color:var(--muted);font-size:11px}.group{font-size:9px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;padding:0 8px;margin:12px 0 7px}.conv{padding:8px 9px;border-radius:6px;color:#aab3a7;font-size:11px;display:flex;justify-content:space-between;gap:8px}.conv.active{background:#1a211a;color:var(--text);border-left:2px solid var(--lime)}.conv span:last-child{color:#657060;font:10px var(--mono)}.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding:14px 6px 0}.creditline{display:flex;justify-content:space-between;font-size:10px;color:var(--sub)}.meter{height:3px;background:#283027;border-radius:4px;margin:8px 0 12px}.meter i{display:block;width:68%;height:100%;background:var(--lime);border-radius:4px}.profile{display:flex;align-items:center;gap:9px;font-size:11px}.avatar{width:28px;height:28px;border-radius:50%;background:#303a2d;color:var(--lime);display:grid;place-items:center;font-size:10px;font-weight:700}.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}.top{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;flex-shrink:0}.crumb{font-size:12px;color:var(--sub)}.crumb strong{color:var(--text);font-weight:600}.topright{display:flex;align-items:center;gap:16px;color:var(--muted);font-size:11px}.credit{border:1px solid var(--line);padding:6px 9px;border-radius:6px;color:var(--sub)}.credit b{color:var(--lime);font:11px var(--mono)}.content{width:100%;max-width:1050px;margin:0 auto;padding:38px 38px 24px;flex:1}.eyebrow{font:10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--lime)}h1{font-size:30px;letter-spacing:-.045em;line-height:1.13;margin:10px 0 9px;font-weight:620}h2{font-size:17px;letter-spacing:-.025em;margin:0 0 7px}p{color:var(--sub);margin:0}.lead{max-width:650px;font-size:13px;line-height:1.7}.divider{border-top:1px solid var(--line);margin:26px 0}.composer{margin:22px auto 0;max-width:850px;border:1px solid var(--line2);background:var(--input);border-radius:12px;padding:13px;box-shadow:0 16px 40px #0003}.composer textarea{display:block;width:100%;resize:vertical;min-height:62px;max-height:160px;background:transparent;border:0;outline:0;color:var(--text);font-size:13px}.composer textarea::placeholder{color:#667064}.composebar{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:10px;margin-top:8px}.tools{display:flex;gap:7px;align-items:center}.chip{border:1px solid var(--line);background:#171d18;color:var(--sub);padding:6px 9px;border-radius:6px;font-size:10px}.chip.sel{border-color:#617a3b;color:var(--lime);background:#20291a}.btn{border:0;border-radius:7px;background:var(--lime);color:var(--limeink);font-size:11px;font-weight:700;padding:9px 14px}.btn.secondary{background:#1b221c;border:1px solid var(--line2);color:var(--text)}.btn.ghost{background:transparent;color:var(--sub);border:1px solid var(--line)}.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-top:24px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:17px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.micro{font:10px var(--mono);color:var(--muted)}.agentrow{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}.agenticon{width:28px;height:28px;display:grid;place-items:center;background:#20291a;border-radius:7px;color:var(--lime);font-size:12px}.agentrow strong{font-size:12px;display:block}.agentrow small{font-size:10px;color:var(--muted)}.rate{font:10px var(--mono);color:var(--sub)}.stage{display:grid;grid-template-columns:25px 1fr auto;gap:10px;align-items:start;position:relative;padding:9px 0}.stage:not(:last-child):after{content:"";position:absolute;left:11px;top:31px;height:calc(100% - 15px);border-left:1px solid #394638}.dot{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;border:1px solid #526c35;color:var(--lime);font:10px var(--mono);background:#192116;z-index:1}.stage strong{font-size:11px}.stage small{display:block;color:var(--muted);font-size:10px}.status{font:9px var(--mono);color:var(--muted);text-transform:uppercase}.message{display:flex;gap:12px;margin:22px 0}.message .avatar{flex-shrink:0}.bubble{max-width:780px}.bubblehead{font-size:11px;font-weight:700;margin:2px 0 7px}.bubble p{font-size:13px;line-height:1.75;color:#d4dbd0}.code{background:#0a0e0b;border:1px solid var(--line);border-radius:8px;padding:14px;margin-top:12px;font:11px/1.8 var(--mono);color:#c8d5bf;white-space:pre-wrap}.filetab{display:inline-block;padding:8px 11px;border-bottom:2px solid var(--lime);font:10px var(--mono);color:var(--lime)}.codehead{display:flex;justify-content:space-between;align-items:center;background:#111612;border:1px solid var(--line);border-bottom:0;padding:10px 13px;border-radius:8px 8px 0 0}.codebody{background:#0a0e0b;border:1px solid var(--line);padding:18px;font:11px/1.8 var(--mono);color:#b9c8b1;min-height:240px;white-space:pre}.pricegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}.price{border:1px solid var(--line);border-radius:9px;padding:17px;background:var(--surface)}.price.featured{border-color:#647e3c;background:#171f15}.price h3{font-size:12px;margin:0}.price .amount{font-size:26px;letter-spacing:-.04em;margin:12px 0 2px}.price ul{padding-left:16px;color:var(--sub);font-size:10px;line-height:2.1}.settingrow{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-top:1px solid var(--line)}.settingrow strong{font-size:12px}.settingrow small{display:block;color:var(--muted);font-size:10px}.hero{padding:46px 0 32px;display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center}.hero h1{font-size:49px;line-height:1.02;max-width:550px}.hero p{font-size:14px;line-height:1.8;max-width:480px}.heroactions{display:flex;gap:10px;margin-top:22px}.demo{background:#121813;border:1px solid #344033;border-radius:12px;padding:17px;transform:rotate(.5deg)}.demotop{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:13px;font:10px var(--mono);color:var(--muted)}.demorow{display:flex;align-items:center;gap:10px;padding:10px 0}.demonum{font:10px var(--mono);color:var(--lime);width:20px}.demotext strong{display:block;font-size:11px}.demotext small{color:var(--muted);font-size:10px}.demoout{border:1px solid #526c35;background:#182016;padding:11px;border-radius:7px;margin-top:10px;font-size:11px}.demoout b{color:var(--lime)}.featurelist{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:26px 0}.feature{padding:17px 13px;border-right:1px solid var(--line)}.feature:last-child{border:0}.feature b{font-size:12px;display:block;margin-bottom:5px}.feature span{font-size:10px;color:var(--muted)}.authwrap{min-height:calc(100vh - 56px);display:grid;grid-template-columns:1.1fr .9fr}.authbrand{padding:60px 7%;background:#101611;border-right:1px solid var(--line)}.authbrand h1{font-size:40px;max-width:480px;margin-top:38px}.authform{display:flex;flex-direction:column;justify-content:center;max-width:380px;padding:35px;margin:auto;width:100%}.google{width:100%;padding:12px;background:#f3f5ef;color:#151a14;border:0;border-radius:7px;font-size:12px;font-weight:700;margin:20px 0}.mutednote{font-size:10px;color:var(--muted);line-height:1.7}.onboard{max-width:700px;margin:45px auto}.stepnav{display:flex;gap:8px;margin:24px 0}.stepnav span{height:3px;flex:1;background:#293129}.stepnav span.on{background:var(--lime)}.toast{position:fixed;bottom:20px;right:20px;background:#202a1e;border:1px solid #526c35;padding:12px 16px;border-radius:8px;font-size:11px;display:none}.prototype-nav{min-height:36px;display:flex;align-items:center;gap:6px;overflow-x:auto;padding:5px 12px;background:#080a08;border-bottom:1px solid var(--line);white-space:nowrap}.prototype-nav button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:5px;padding:4px 8px;font-size:9px}.prototype-nav button.active{color:var(--lime);border-color:#60783c;background:#192116}.mobilemenu{display:none}
@media(max-width:1050px){.app{grid-template-columns:56px 210px minmax(0,1fr)}.content{padding:28px 22px}.hero h1{font-size:40px}}
@media(max-width:760px){.app{grid-template-columns:1fr}.rail{display:none}.side{display:none}.top{padding:0 16px}.mobilemenu{display:inline-block}.content{padding:24px 16px}.hero{grid-template-columns:1fr;padding-top:25px}.hero h1{font-size:39px}.grid2{grid-template-columns:1fr}.pricegrid{grid-template-columns:1fr}.featurelist{grid-template-columns:repeat(2,1fr)}.feature:nth-child(2){border-right:0}.feature:nth-child(-n+2){border-bottom:1px solid var(--line)}.authwrap{grid-template-columns:1fr}.authbrand{display:none}.authform{padding:24px}.topright .hide-sm{display:none}}
</style></head><body><div id="root"></div><div class="toast" id="toast" role="status"></div>
<script>
const screens=['Landing','Login','Onboarding','Workspace','Agent Library','Conversation','Team Run','Artifact','Billing','Settings'];let screen='Workspace';let theme='dark';
const nav=`<aside class="rail"><div class="brand">AF</div><button class="railbtn active" title="Workspace" onclick="go('Workspace')">⌂</button><button class="railbtn" title="Agents" onclick="go('Agent Library')">◇</button><button class="railbtn" title="Billing" onclick="go('Billing')">◈</button><div class="railbottom"><button class="railbtn" title="Settings" onclick="go('Settings')">⚙</button></div></aside><aside class="side"><div class="sidehead"><div class="wordmark">AGENTFORGE<small>THE WORKSPACE</small></div><span class="micro">⌘ K</span></div><button class="new" onclick="go('Workspace')">＋ &nbsp; New task <b>⌘ N</b></button><div class="search">⌕ &nbsp; Search conversations</div><div class="group">Recent</div><div class="conv active" onclick="go('Conversation')">Build a webhook service <span>now</span></div><div class="conv">Research vector databases <span>1d</span></div><div class="conv">Prepare a product brief <span>2d</span></div><div class="conv">Explain OAuth flows <span>4d</span></div><div class="group">Explore</div><div class="conv" onclick="go('Agent Library')">◇ &nbsp; Agent library</div><div class="conv" onclick="go('Billing')">◈ &nbsp; Credits & plans</div><div class="sidefoot"><div class="creditline"><span>Credit balance</span><b style="color:var(--lime)">68 / 100</b></div><div class="meter"><i></i></div><div class="profile"><div class="avatar">SP</div><div><b>Workspace member</b><div class="micro">FREE PLAN</div></div></div></div></aside>`;
function header(title){return `<header class="top"><div class="crumb"><span class="mobilemenu" onclick="toast('Navigation drawer prototype')">☰ &nbsp;</span>Workspace <span style="color:#526052"> / </span> <strong>${title}</strong></div><div class="topright"><span class="hide-sm">⌘ K &nbsp; Commands</span><span class="credit">◈ &nbsp; <b>68</b> credits</span><button class="railbtn" onclick="toggleTheme()" title="Toggle theme">◐</button></div></header>`}
function composer(){return `<div class="composer"><textarea placeholder="Describe the work you want done…" id="prompt"></textarea><div class="composebar"><div class="tools"><button class="chip" onclick="toast('File picker is represented in this static prototype')">＋ Attach</button><button class="chip sel" onclick="toast('Mode selector: Auto / Team / Coding / Search / PDF / PPT / Image')">✧ Auto</button><span class="micro hide-sm">Shift + Enter for new line</span></div><button class="btn" onclick="sendDemo()">Send ↗</button></div></div>`}
function landing(){return `<div class="content"><div class="hero"><div><div class="eyebrow">AI WORK, DIRECTED</div><h1>Give complex work a team.</h1><p>Research, code and create with specialist AI agents in one inspectable workspace. Set the direction. Keep control of the output.</p><div class="heroactions"><button class="btn" onclick="go('Login')">Start with Google ↗</button><button class="btn secondary" onclick="go('Team Run')">Explore the workflow</button></div><div class="micro" style="margin-top:17px">RESEARCH &nbsp; / &nbsp; ENGINEERING &nbsp; / &nbsp; DOCUMENTS</div></div><div class="demo"><div class="demotop"><span>ILLUSTRATIVE WORKFLOW</span><span>AF / 04</span></div><div class="demorow"><div class="demonum">01</div><div class="demotext"><strong>Planner</strong><small>Break the brief into a workable plan</small></div></div><div class="demorow"><div class="demonum" style="color:var(--blue)">02</div><div class="demotext"><strong>Researcher</strong><small>Gather technical context when needed</small></div></div><div class="demorow"><div class="demonum" style="color:var(--purple)">03</div><div class="demotext"><strong>Collaborative coder</strong><small>Build the requested source artifacts</small></div></div><div class="demorow"><div class="demonum" style="color:var(--amber)">04</div><div class="demotext"><strong>Reviewer</strong><small>Review and request a revision if needed</small></div></div><div class="demoout"><b>↳ OUTPUT</b> &nbsp; Response + inspectable files</div></div></div><div class="featurelist"><div class="feature"><b>Research</b><span>Find current information with web search.</span></div><div class="feature"><b>Engineering</b><span>Generate code and multi-file artifacts.</span></div><div class="feature"><b>Documents</b><span>Create PDF and presentation outputs.</span></div><div class="feature"><b>Visuals</b><span>Generate images and analyze uploads.</span></div></div><div class="divider"></div><div class="eyebrow">HOW THE WORK MOVES</div><h2 style="font-size:23px;margin:8px 0">One brief. Specialist execution. A usable result.</h2><p class="lead">Choose Auto for routing or direct a specific mode. For complex engineering work, Team invokes a structured multi-agent graph.</p><div class="heroactions"><button class="btn" onclick="go('Login')">Create your workspace</button></div></div>`}
function login(){return `<div class="authwrap"><div class="authbrand"><div class="eyebrow">AGENTFORGE / ACCESS</div><h1>Make room for the work that matters.</h1><p>One workspace for research, engineering and generated outputs.</p><div class="demo" style="margin-top:35px;max-width:460px"><div class="demotop">WORKFLOW / 04 STAGES</div><div class="demorow"><div class="demonum">01</div><div class="demotext"><strong>Plan the work</strong><small>Turn a complex request into steps</small></div></div><div class="demorow"><div class="demonum">02</div><div class="demotext"><strong>Build the result</strong><small>Specialists handle their part</small></div></div></div></div><div class="authform"><div class="eyebrow">WELCOME TO THE FORGE</div><h1 style="font-size:28px">Sign in to continue.</h1><p>Use your Google account to access your AgentForge workspace.</p><button class="google" onclick="toast('Prototype only — connect existing Firebase Google sign-in')">G &nbsp; Continue with Google</button><p class="mutednote">New to AgentForge? Your workspace is created when you continue with Google. This prototype does not implement authentication.</p><p class="mutednote" style="margin-top:22px">By continuing, you agree to the Terms of Service and Privacy Policy, when published.</p></div></div>`}
function onboarding(){return `<div class="content"><div class="onboard"><div class="eyebrow">FIRST SESSION / 01 OF 03</div><h1 style="font-size:34px">A better way to direct AI work.</h1><p class="lead">AgentForge gives you a few ways to start. You can let the router choose, or direct a specialist yourself.</p><div class="stepnav"><span class="on"></span><span></span><span></span></div><div class="panel" style="margin-top:25px"><div class="agentrow"><div class="agenticon">✧</div><div><strong>Auto</strong><small>Routes your prompt to a suitable agent.</small></div><span class="rate">DEFAULT</span></div><div class="agentrow"><div class="agenticon">◎</div><div><strong>Team</strong><small>Uses the Planner → optional Researcher → Coder → Reviewer graph.</small></div><span class="rate">15 CR</span></div><div class="agentrow"><div class="agenticon">⌘</div><div><strong>Specialists</strong><small>Target coding, search, PDF, presentations or image generation.</small></div><span class="rate">1–10 CR</span></div></div><div class="heroactions"><button class="btn" onclick="go('Workspace')">Continue to workspace ↗</button><button class="btn ghost" onclick="go('Workspace')">Skip</button></div></div></div>`}
function workspace(){return `<div class="content"><div class="eyebrow">WORKSPACE / NEW TASK</div><h1>What are we working on?</h1><p class="lead">Start with a brief. Choose a specialist or let AgentForge route the request.</p>${composer()}<div class="grid2"><section class="panel"><div class="panelhead"><h2>Start with a direction</h2><span class="micro">EXAMPLES</span></div><div class="agentrow"><div class="agenticon">⌘</div><div><strong>Build a service</strong><small>Design and generate a small REST API with tests.</small></div><span class="rate">CODE</span></div><div class="agentrow"><div class="agenticon" style="color:var(--blue)">⌕</div><div><strong>Research a technical topic</strong><small>Compare approaches and summarize trade-offs.</small></div><span class="rate">SEARCH</span></div><div class="agentrow"><div class="agenticon" style="color:var(--amber)">▤</div><div><strong>Create a technical report</strong><small>Generate a structured PDF document.</small></div><span class="rate">PDF</span></div></section><section class="panel"><div class="panelhead"><h2>Choose your mode</h2><span class="micro">SUPPORTED MODES</span></div><div class="stage"><div class="dot">✧</div><div><strong>Auto router</strong><small>Best starting point for most tasks</small></div><span class="status">DEFAULT</span></div><div class="stage"><div class="dot">◎</div><div><strong>Team workflow</strong><small>Planning, optional research, coding and review</small></div><span class="status">15 CR</span></div><div class="stage"><div class="dot">⌘</div><div><strong>Specialist agents</strong><small>Code · Search · PDF · PPT · Image</small></div><span class="status">1–10 CR</span></div></section></div></div>`}
function agents(){let a=[['Auto Router','Selects the best route for a request','Dynamic'],['Team','Multi-step planning, optional research, coding and review','15 credits'],['Coding','Code generation and engineering assistance','10 credits'],['Search','Current web research using Tavily','5 credits'],['PDF','Generate a PDF document','10 credits'],['Presentation','Generate a PowerPoint deck','10 credits'],['Image generation','Create an image','10 credits'],['PDF RAG','Question-answering over an uploaded PDF; auto-routed','10 credits'],['Image analyzer','Analyze an uploaded image; auto-routed','5 credits'],['Chat','General conversation and explanations','1 credit']];return `<div class="content"><div class="eyebrow">CAPABILITIES / AGENT LIBRARY</div><h1>Choose the right specialist.</h1><p class="lead">A clear catalog of the modes AgentForge can route to today. Some attachment routes are automatic rather than selectable.</p><div class="panel" style="margin-top:24px">${a.map((x,i)=>`<div class="agentrow"><div class="agenticon">${['✧','◎','⌘','⌕','▤','▥','✳','▧','◉','◌'][i]}</div><div><strong>${x[0]}</strong><small>${x[1]}</small></div><span class="rate">${x[2]}</span></div>`).join('')}</div><p class="mutednote" style="margin-top:14px">Credit rates are defined in the current auth service. Actual routing and deduction happen server-side. Image generation and image analysis are separate capabilities.</p></div>`}
function conversation(){return `<div class="content"><div class="eyebrow">CONVERSATION / CODING</div><h1 style="font-size:25px">Build a webhook service</h1><div class="message"><div class="avatar">SP</div><div class="bubble"><div class="bubblehead">You</div><p>Design a small webhook service with signature verification, retry handling and a clean API structure.</p></div></div><div class="message"><div class="avatar" style="background:#26331d;color:var(--lime)">AF</div><div class="bubble"><div class="bubblehead">AgentForge <span class="micro">· CODING MODE</span></div><p>Here is a practical service boundary: accept the event, verify the signature against the raw request body, persist delivery state, and dispatch handlers asynchronously. Keep retry policy separate from request validation.</p><div class="code">src/\n  routes/webhooks.js\n  middleware/verifySignature.js\n  services/deliveryQueue.js\n  services/retryPolicy.js\n  models/WebhookDelivery.js\n  tests/webhooks.test.js</div><div class="micro" style="margin-top:10px">RESPONSE PREVIEW — ILLUSTRATIVE CONTENT</div></div></div>${composer()}</div>`}
function team(){return `<div class="content"><div class="eyebrow">TEAM MODE / WORKFLOW STRUCTURE</div><h1>Collaborative engineering workflow.</h1><p class="lead">Team mode invokes a LangGraph workflow. The current API returns a final result, not live per-agent events; this view documents the known workflow structure rather than pretending to show runtime telemetry.</p><div class="grid2" style="grid-template-columns:1fr .85fr"><section class="panel"><div class="panelhead"><h2>Workflow path</h2><span class="micro">GRAPH DEFINITION</span></div><div class="stage"><div class="dot">01</div><div><strong>Planner</strong><small>Breaks the task into a plan; may request research.</small></div><span class="status">NODE</span></div><div class="stage"><div class="dot" style="color:var(--blue);border-color:#49647b">02</div><div><strong>Researcher <span class="micro">(conditional)</span></strong><small>Runs only when planner selects this next step.</small></div><span class="status">OPTIONAL</span></div><div class="stage"><div class="dot" style="color:var(--purple);border-color:#70568b">03</div><div><strong>Collaborative coder</strong><small>Produces the implementation and files.</small></div><span class="status">NODE</span></div><div class="stage"><div class="dot" style="color:var(--amber);border-color:#816638">04</div><div><strong>Reviewer</strong><small>Can approve or request a coder revision.</small></div><span class="status">NODE</span></div><div class="stage"><div class="dot">↺</div><div><strong>Revision loop</strong><small>Returns to coder when reviewer selects coder.</small></div><span class="status">CONDITIONAL</span></div></section><section class="panel"><div class="eyebrow">CURRENT API LIMIT</div><h2 style="margin-top:10px">What the UI can truthfully show</h2><p style="font-size:12px;line-height:1.8">The chat endpoint returns the final answer, images and artifacts. It does not return per-node timestamps, logs or state transitions. During execution, use an indeterminate pending state. After completion, show this workflow structure and the actual final result.</p><div class="divider"></div><div class="micro">FUTURE OBSERVABILITY REQUIRES BACKEND EVENTS + RUN STORAGE.</div></section></div></div>`}
function artifact(){return `<div class="content"><div class="eyebrow">OUTPUT / ARTIFACT INSPECTOR</div><h1>Inspect the generated files.</h1><p class="lead">A lightweight source viewer for returned code artifacts. The editor is read-only; copy or download the active file.</p><div class="panel" style="padding:0;margin-top:23px;overflow:hidden"><div class="codehead"><div><b style="font-size:12px">Webhook service</b><div class="micro">3 FILES · SOURCE VIEW</div></div><div><button class="btn secondary" onclick="toast('Copied active file in the real application')">Copy</button> <button class="btn" onclick="toast('Download active file in the real application')">Download</button></div></div><div style="border-bottom:1px solid var(--line)"><span class="filetab">routes.js</span><span class="filetab" style="color:var(--muted);border:0">verifySignature.js</span><span class="filetab" style="color:var(--muted);border:0">retryPolicy.js</span></div><div class="codebody">01  import express from 'express';\n02  import { verifySignature } from '../middleware/verifySignature.js';\n03  import { enqueueDelivery } from '../services/deliveryQueue.js';\n04\n05  const router = express.Router();\n06\n07  router.post('/webhooks/:provider', verifySignature, async (req, res) =&gt; {\n08    await enqueueDelivery({\n09      provider: req.params.provider,\n10      event: req.body,\n11    });\n12    res.status(202).json({ accepted: true });\n13  });\n14\n15  export default router;</div></div><p class="mutednote" style="margin-top:12px">Prototype source is illustrative. In the real product, tabs and content come from `artifacts[0].files`; Preview appears only when an `index.html` file is present.</p></div>`}
function billing(){return `<div class="content"><div class="eyebrow">ACCOUNT / CREDITS & PLANS</div><h1>Keep your work moving.</h1><p class="lead">Your balance and available plans, with credit rates explained up front.</p><div class="panel" style="margin-top:22px;display:flex;justify-content:space-between;align-items:center"><div><div class="micro">CURRENT BALANCE</div><div style="font-size:34px;letter-spacing:-.05em;margin-top:4px">68 <span style="font-size:12px;color:var(--muted)">credits</span></div><p style="font-size:11px">Free plan · 30-day validity</p></div><div style="width:140px"><div class="creditline"><span>Used</span><span>32 / 100</span></div><div class="meter"><i style="width:68%"></i></div></div></div><div class="pricegrid"><div class="price"><h3>Free</h3><div class="amount">$0</div><p>100 credits / 30 days</p><ul><li>Core agent modes</li><li>Standard workspace</li></ul><button class="btn secondary" onclick="toast('Free plan selected')">Current plan</button></div><div class="price"><h3>Starter</h3><div class="amount">$9.99</div><p>500 credits / 30 days</p><ul><li>More room for regular work</li><li>Same core capabilities</li></ul><button class="btn" onclick="toast('Connect Stripe checkout to activate')">Choose Starter</button></div><div class="price featured"><h3>Pro</h3><div class="amount">$19.99</div><p>1,500 credits / 30 days</p><ul><li>Higher-volume usage</li><li>Same core capabilities</li></ul><button class="btn" onclick="toast('Connect Stripe checkout to activate')">Choose Pro</button></div></div><p class="mutednote" style="margin-top:13px">Prices and credits match backend plan config. Billing cadence wording must be confirmed from Stripe configuration before production copy.</p></div>`}
function settings(){return `<div class="content"><div class="eyebrow">PREFERENCES / SETTINGS</div><h1>Make the workspace yours.</h1><p class="lead">Account information and local interface preferences.</p><div class="panel" style="margin-top:24px"><div class="panelhead"><h2>Profile</h2><span class="micro">FROM ACCOUNT</span></div><div class="settingrow"><div><strong>Display name</strong><small>Workspace member</small></div><span class="micro">READ ONLY</span></div><div class="settingrow"><div><strong>Email address</strong><small>member@example.com</small></div><span class="micro">READ ONLY</span></div><div class="settingrow"><div><strong>Appearance</strong><small>Choose the workspace theme</small></div><button class="btn secondary" onclick="toggleTheme()">Toggle dark / light</button></div><div class="settingrow"><div><strong>Keyboard shortcuts</strong><small>⌘/Ctrl + K · Commands &nbsp; | &nbsp; ⌘/Ctrl + N · New task</small></div><span class="micro">BUILT IN</span></div><div class="settingrow"><div><strong>Sign out</strong><small>End this browser session</small></div><button class="btn ghost" onclick="toast('Connect existing logout endpoint')">Sign out</button></div></div><p class="mutednote" style="margin-top:12px">Appearance is local in this prototype. No server-synced preference API is present in the inspected repository.</p></div>`}
function sendDemo(){let v=document.getElementById('prompt')?.value||'';toast(v?'Prototype interaction: task composer submitted.':'Write a brief first.');}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
function toggleTheme(){if(theme==='dark'){theme='light';document.documentElement.style.setProperty('--bg','#f4f5ef');document.documentElement.style.setProperty('--side','#ecefe7');document.documentElement.style.setProperty('--surface','#fff');document.documentElement.style.setProperty('--elev','#fff');document.documentElement.style.setProperty('--input','#fafbf7');document.documentElement.style.setProperty('--text','#1a2119');document.documentElement.style.setProperty('--sub','#53604f');document.documentElement.style.setProperty('--muted','#758171');document.documentElement.style.setProperty('--line','#dce2d7');document.documentElement.style.setProperty('--line2','#b7c2b0');document.documentElement.style.setProperty('--lime','#557d1f');document.documentElement.style.setProperty('--limeink','#fff');}else{theme='dark';location.reload();}}
function go(s){screen=s;render()}
function render(){let body=({Landing:landing,Login:login,Onboarding:onboarding,Workspace:workspace,'Agent Library':agents,Conversation:conversation,'Team Run':team,Artifact:artifact,Billing:billing,Settings:settings})[screen]();let publicPage=screen==='Landing'||screen==='Login';let picker=`<div class="prototype-nav"><span class="micro" style="padding:0 8px">SCREENS</span>${screens.map(s=>`<button class="${s===screen?'active':''}" onclick="go('${s}')">${s}</button>`).join('')}</div>`;document.getElementById('root').innerHTML=picker+(publicPage?`${header(screen)}${body}`:`<div class="app">${nav}<main class="main">${header(screen)}${body}</main></div>`);}
render();
</script></body></html>
